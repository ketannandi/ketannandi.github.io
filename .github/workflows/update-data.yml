name: Update publications and citations

on:
  schedule:
    - cron: "30 2 * * 1"   # every Monday, 8:00 AM India time
  workflow_dispatch:        # adds a "Run workflow" button for manual updates

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest papers and citations
        run: python scripts/update_data.py

      - name: Save changes to the website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json
          if git diff --staged --quiet; then
            echo "No changes this week."
          else
            git commit -m "Weekly update of publications and citations"
            git push
          fi
